<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidéo théorique</title>
    <link rel="stylesheet" href="css/style_articles_annexe.css">
</head>

<body>
    <div class="main-content">
        <h1>Vidéo théorique</h1>
        <!-- On place le sous-titre dans 'main-content' avec un alignement à gauche -->
        <p class="nom_exercice" style="text-align: left;">Comprendre le bassin et le périnée</p>
    </div>


    <div style="display: flex; justify-content: center; width: 100%;">

        <div class="video-container" style="width: 50%; flex-shrink: 0;">
            <video src="VIDEO/Comprendre le bassin et le périnée.mov" poster="IMG/img affiche.jpg" style="width: 100%; height: auto; display: block;"></video>
            <div class="video-controls">
                <button class="play-pause control-btn">▶</button>
                <input type="range" class="progress-bar" min="0" max="100" value="0">
                <div class="volume-container">
                    <button class="mute-btn control-btn">🔊</button>
                    <input type="range" class="volume-bar" min="0" max="1" step="0.1" value="1">
                </div>
            </div>
        </div>

           
        </div>
    <div class="espace_court"></div>


<!-- SCRIPT UNIQUE POUR TOUTES LES VIDÉOS -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const containers = document.querySelectorAll('.video-container');

        containers.forEach(container => {
          const video = container.querySelector('video');
          const playPauseBtn = container.querySelector('.play-pause');
          const progressBar = container.querySelector('.progress-bar');
          const muteBtn = container.querySelector('.mute-btn');
          const volumeBar = container.querySelector('.volume-bar');

          // Play / Pause
          playPauseBtn.addEventListener('click', () => {
            if (video.paused) {
              video.play();
              playPauseBtn.textContent = '⏸';
            } else {
              video.pause();
              playPauseBtn.textContent = '▶';
            }
          });

          video.addEventListener('click', () => playPauseBtn.click());

          // Barre de progression
          video.addEventListener('timeupdate', () => {
            const percentage = (video.currentTime / video.duration) * 100;
            progressBar.value = isNaN(percentage) ? 0 : percentage;
          });

          progressBar.addEventListener('input', () => {
            video.currentTime = (progressBar.value / 100) * video.duration;
          });

          // Volume
          volumeBar.addEventListener('input', () => {
            video.volume = volumeBar.value;
            muteBtn.textContent = video.volume === 0 ? '🔇' : (video.volume < 0.5 ? '🔉' : '🔊');
          });

          // Mute
          muteBtn.addEventListener('click', () => {
            video.muted = !video.muted;
            muteBtn.textContent = video.muted ? '🔇' : (video.volume < 0.5 ? '🔉' : '🔊');
            volumeBar.value = video.muted ? 0 : video.volume;
          });

          // Reset fin de vidéo
          video.addEventListener('ended', () => {
            playPauseBtn.textContent = '▶';
            progressBar.value = 0;
          });
        });
      });
    </script>


 
    </div>
    </div>
</body>
</html>
